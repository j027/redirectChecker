services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: redirectChecker
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redirectChecker"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: redirectChecker
      DISPLAY: ":0"
      TZ: America/New_York
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"
    shm_size: "1gb"
    security_opt:
      - apparmor:unconfined
      - "seccomp:./docker/seccomp-chrome.json"
    stop_grace_period: 60s
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  autoheal:
    image: willfarrell/autoheal@sha256:2fb036bb6d0bcd4d7ff8408a86d60b0703fa610cc645cacd742f2f3bb1a7e124
    restart: unless-stopped
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_ONLY_MONITOR_RUNNING: "true"
      AUTOHEAL_START_PERIOD: 120
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
