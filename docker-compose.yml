services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: redirectChecker
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redirectChecker"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: redirectChecker
      DISPLAY: ":0"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"
    shm_size: "1gb"
    security_opt:
      - apparmor:unconfined
      - "seccomp:./docker/seccomp-chrome.json"
    stop_grace_period: 60s

volumes:
  pgdata:
