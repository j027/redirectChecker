<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mock GPT page (button-only creative)</title>
</head>
<body>
  <div id="slot-1" data-google-query-id="fixture-button" style="width: 300px; height: 250px">
    <iframe id="google_ads_iframe_/123/fixture_button" name="google_ads_iframe_/123/fixture_button" width="300" height="250"></iframe>
  </div>

  <script>
    const landingUrl = new URL("/landing.html", location.href).href;
    const friendly = document.getElementById("google_ads_iframe_/123/fixture_button");
    const doc = friendly.contentDocument;
    doc.open();
    doc.write(
      '<!doctype html><html><body style="margin:0">' +
        '<button id="cta" onclick="window.open(\'' + landingUrl + '\', \'_blank\')" ' +
        'style="width:300px;height:250px;background:#1a4fd6;color:#fff;font-size:32px;border:none">Download</button>' +
      "</body></html>"
    );
    doc.close();
  </script>
</body>
</html>
