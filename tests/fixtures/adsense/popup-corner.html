<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mock GPT page (corner button creative)</title>
</head>
<body>
  <div id="slot-1" data-google-query-id="fixture-corner" style="width: 300px; height: 250px">
    <iframe id="google_ads_iframe_/123/fixture_corner" name="google_ads_iframe_/123/fixture_corner" width="300" height="250"></iframe>
  </div>

  <script>
    const landingUrl = new URL("/landing.html", location.href).href;
    const friendly = document.getElementById("google_ads_iframe_/123/fixture_corner");
    const doc = friendly.contentDocument;
    doc.open();
    doc.write(
      '<!doctype html><html><body style="margin:0">' +
        '<div style="width:300px;height:250px;background:#ddd;position:relative">' +
        '<button id="cta" onclick="window.open(\'' + landingUrl + '\', \'_blank\')" ' +
        'style="position:absolute;left:10px;top:10px;width:120px;height:40px;font-size:16px">Download</button>' +
        "</div>" +
      "</body></html>"
    );
    doc.close();
  </script>
</body>
</html>
