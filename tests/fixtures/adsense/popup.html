<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mock GPT page (popup creative)</title>
</head>
<body>
  <div id="slot-1" data-google-query-id="fixture-popup" style="width: 300px; height: 250px">
    <iframe id="google_ads_iframe_/123/fixture_popup" name="google_ads_iframe_/123/fixture_popup" width="300" height="250"></iframe>
  </div>

  <script>
    const landingUrl = new URL("/landing.html", location.href).href;
    const friendly = document.getElementById("google_ads_iframe_/123/fixture_popup");
    const doc = friendly.contentDocument;
    doc.open();
    doc.write(
      '<!doctype html><html><body style="margin:0">' +
        '<button id="cta" style="width:100%;height:250px" onclick="window.open(\'' +
        landingUrl +
        '\', \'_blank\')">Download now</button>' +
      "</body></html>"
    );
    doc.close();
  </script>
</body>
</html>
